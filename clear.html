<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังอัปเดตแอป...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container { max-width: 360px; }
    .spinner {
      width: 60px; height: 60px;
      border: 5px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin-bottom: 12px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; }
    .status { margin-top: 20px; font-size: 12px; color: #6366f1; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>🔄 กำลังอัปเดตแอป...</h1>
    <p>กำลังลบข้อมูลเก่าและโหลดเวอร์ชันใหม่<br>กรุณารอสักครู่...</p>
    <div class="status" id="status">เริ่มต้น...</div>
  </div>
  <script>
    const statusEl = document.getElementById('status');

    async function nuclearClear() {
      try {
        // Step 1: Unregister ALL Service Workers
        statusEl.textContent = '🗑️ ลบ Service Worker เก่า...';
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
          }
          statusEl.textContent = '✅ ลบ SW สำเร็จ (' + regs.length + ' ตัว)';
        }

        // Step 2: Delete ALL caches & localStorage
        await new Promise(r => setTimeout(r, 500));
        statusEl.textContent = '🗑️ ลบ Cache เก่าทั้งหมด...';
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }
        try {
          localStorage.clear();
          sessionStorage.clear();
          statusEl.textContent = '✅ ล้างข้อมูลและ Cache สำเร็จ!';
        } catch (e) {}

        // Step 3: Redirect to main app with cache-busting
        await new Promise(r => setTimeout(r, 1000));
        statusEl.textContent = '🚀 กำลังเปิดแอปเวอร์ชันใหม่...';
        await new Promise(r => setTimeout(r, 500));

        window.location.replace('./index.html?v=' + Date.now());

      } catch (err) {
        statusEl.textContent = '❌ เกิดข้อผิดพลาด: ' + err.message;
        // Redirect anyway after 3s
        setTimeout(() => {
          window.location.replace('./index.html?v=' + Date.now());
        }, 3000);
      }
    }

    nuclearClear();
  </script>
</body>
</html>
